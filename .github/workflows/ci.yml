name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  portal-acesso:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-acesso
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - run: bash -n deploy/implantar.sh
